spring.application.name=ClaimShieldX

# DB Setup
spring.datasource.url=jdbc:postgresql://localhost:5432/claim_shield_x
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Gemini API Key Setup
spring.ai.google.genai.api-key= ${SPRING_AI_GOOGLE_GENAI_API_KEY}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.auth.jwt-secret=${JWT_SECRET_KEY}
app.auth.jwt-expiration-seconds=1800
app.auth.refresh-expiration-seconds=604800

# Uploads: 20 MB per file, a little more per request for the other form parts (decision D6)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.documents.max-per-claim=50

# Original documents. "local" is for development; "gcs" needs app.storage.gcs.bucket. There is no fallback between them.
app.storage.type=local
# Local storage refuses to start on Cloud Run (its disk is wiped on restart) unless this is set, for a throwaway demo only
app.storage.allow-local-on-cloud-run=false
app.storage.local-path=${user.home}/.claimshield/documents
app.storage.gcs.bucket=
app.storage.gcs.project-id=

# Idempotency-Key records live this long; a request still marked in progress after the timeout is treated as dead
app.idempotency.ttl-hours=24
app.idempotency.in-progress-timeout-seconds=300

# A database connection must not stay checked out while a large file streams to a slow client
spring.jpa.open-in-view=false

# Document extraction (B5). The model, prompt and schema versions are stored with every extraction.
# provider=gemini calls the Gemini API with the key above; provider=fake never leaves the machine (tests).
# The free tier lets Google review prompts: only synthetic documents may be extracted while it is in use.
app.extraction.provider=gemini
app.extraction.model=gemini-3.5-flash-lite
app.extraction.fallback-models=gemini-3.1-flash-lite
app.extraction.schema-version=itemized-cost-2
app.extraction.prompt-version=1
app.extraction.thinking-level=LOW
app.extraction.max-output-tokens=16384
app.extraction.request-timeout=90s
app.extraction.max-model-attempts=3
# Free-tier limit is 15 requests a minute; stay below it
app.extraction.max-requests-per-minute=10
app.extraction.max-concurrent-requests=2
# Largest original sent inline: the upload limit (20 MiB). Measured: the model accepted a 20.79 MB file; see the extraction notes
app.extraction.max-inline-bytes=20971520
app.extraction.max-pages=40
app.extraction.max-attempts-per-document=5

# Historical claims and garage-history imports (B6). Files over the size limit, or with more rows, fail as a whole.
app.history.max-file-bytes=5242880
app.history.max-rows=10000
# A date without a time in a history file means the start of that day in this zone
app.history.date-only-zone=Asia/Kolkata
app.history.max-matches=50
# An import still PROCESSING after this long belonged to a process that died; the next import of its kind marks it FAILED
app.history.stale-processing-after=15m
# Deterministic rules (B7). Defaults for the insurer to confirm; every rule run stores the values it used.
app.rules.time-zone=Asia/Kolkata
app.rules.round-off-allowance=1.00
app.rules.line-base-allowance=0.01
app.rules.variance-percent-threshold=10.00
app.rules.variance-minimum-increase=1000.00
app.rules.date-tolerance-days=0
app.rules.near-midnight-minutes=180
app.rules.near-duplicate-similarity=0.80
app.rules.min-description-words=2
app.rules.history-recent-days=365
app.rules.max-listed-matches=10
# Investigations (B8): the investigation row is the durable job; a worker claims it with a lease and keeps it alive with a heartbeat.
app.investigation.max-attempts=3
app.investigation.daily-limit-per-organization=20
app.investigation.backoff-initial=30s
app.investigation.backoff-max=10m
app.investigation.backoff-jitter=0.2
app.investigation.lease=3m
app.investigation.heartbeat=30s
app.investigation.waiting-recheck=15s
app.investigation.worker.enabled=true
app.investigation.worker.poll-interval=2s
app.investigation.worker.threads=2
# Review-priority score (B11): points per rule result, version stored with every report. Defaults for the insurer to confirm; not probabilities.
app.scoring.version=1
app.scoring.medium-from=20
app.scoring.high-from=50
# Imports insert thousands of rows; send them to the database in batches
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
