# Dedicated test database. DB_USERNAME / DB_PASSWORD still come from the environment.
spring.datasource.url=jdbc:postgresql://localhost:5432/claim_shield_x_test

# Placeholders so tests never need real keys and can never reach a live model.
spring.ai.google.genai.api-key=test-placeholder-not-a-real-key
app.auth.jwt-secret=test-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz

spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO

# Documents are stored on local disk in a temporary folder during tests
app.storage.type=local
app.storage.local-path=${java.io.tmpdir}/claimshield-test-documents
