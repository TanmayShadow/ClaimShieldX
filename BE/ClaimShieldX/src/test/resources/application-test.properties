# Dedicated test database. DB_USERNAME / DB_PASSWORD still come from the environment.
spring.datasource.url=jdbc:postgresql://localhost:5432/claim_shield_x_test

# Placeholders so tests never need real keys and can never reach a live model.
spring.ai.google.genai.api-key=test-placeholder-not-a-real-key
app.auth.jwt-secret=test-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz

spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO

# Documents are stored on local disk in a temporary folder during tests
app.storage.type=local
app.storage.local-path=${java.io.tmpdir}/claimshield-test-documents

# Extraction uses the scripted fake model in tests, so no test can call a live model. The live evaluation overrides this on purpose.
app.extraction.provider=fake
# Retries must not slow tests down
app.extraction.retry-initial-delay=1ms
app.extraction.retry-max-delay=5ms
# The production request-rate limit would make retry tests wait on the real clock; the gate itself is tested with a fake clock
app.extraction.max-requests-per-minute=100000
app.extraction.max-concurrent-requests=8

# Many test classes keep their own Spring context, and so their own connection pool, alive for the rest of the run. Keep each pool small
# and let idle connections close quickly, so the whole suite stays far below PostgreSQL's limit of 100 connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
